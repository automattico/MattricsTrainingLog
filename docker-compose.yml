services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    environment:
      MATTRICS_DEV_HOST: 0.0.0.0
      MATTRICS_DEV_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/zz-mattrics-dev.ini:ro
    command:
      - /app/scripts/dev-server.sh
